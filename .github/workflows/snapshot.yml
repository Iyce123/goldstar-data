name: Save daily GSE prices

on:
  schedule:
    # Monday to Friday at 16:00 UTC (Ghana time = UTC). The GSE closes around 15:00.
    - cron: "0 16 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch prices and write data files
        run: python3 scripts/snapshot.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Prices for $(date -u +%F)"
            git push
          fi
