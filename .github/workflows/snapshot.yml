name: Save daily GSE prices

on:
  schedule:
    # Monday to Friday at 16:00 UTC (Ghana time = UTC). The GSE closes around 15:00.
    - cron: "0 16 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Network check (temporary)
        continue-on-error: true
        run: |
          getent ahosts dev.kwayisi.org || true
          curl -sS -m 15 -o /dev/null -w "kwayisi: %{http_code}\n" https://dev.kwayisi.org/apis/gse/live || true
          curl -sS -m 15 -o /dev/null -w "gse.com.gh: %{http_code}\n" https://gse.com.gh/trading-and-data/ || true
          curl -sS -m 15 -o /dev/null -w "afx: %{http_code}\n" https://afx.kwayisi.org/gse || true

      - name: Fetch prices and write data files
        run: python3 goldstar-data/scripts/snapshot.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Prices for $(date -u +%F)"
            git push
          fi
